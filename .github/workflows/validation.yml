name: Public playground verification

on:
  pull_request:
  push:
    branches: [main, feat/g3k2-playground-a04-20261117]

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frozen clean consumer install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Frozen clean consumer install
        run: npm ci --no-audit --no-fund
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser probe (K01-I03 real behaviors)
        run: npm run test:browser
      - name: StackBlitz external Chromium probe (A09 - diagnostic, separately accepted)
        continue-on-error: true
        run: node tests/stackblitz-probe.mjs
      - name: Preserve original StackBlitz probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k4-a09-stackblitz-observation
          path: test-results/stackblitz-probe.json
          if-no-files-found: error
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k2-a04-playwright-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
