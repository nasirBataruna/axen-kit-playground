name: Public playground verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # K2 temporary install. A08 frozen lock/clean consumer gate is still PENDING.
      - name: Install public dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public dependencies
        run: npm install --no-audit --no-fund
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser probe (nine route reloads, actual F01)
        run: npm run test:browser
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k2-a04-playwright-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
